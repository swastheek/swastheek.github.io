<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Swastik Shrivastava</title>
<meta name="description" content="Brand and product marketing. Quizmaster since 2021.">
<meta property="og:title" content="Swastik Shrivastava">
<meta property="og:description" content="Brand and product marketing. Quizmaster since 2021.">
<meta property="og:type" content="website">

<script>
/* ==========================================================================
   EVERYTHING YOU EDIT IS BETWEEN THE TWO ===== LINES BELOW.
   Below that is machinery. You never need to touch it.

   Rules, all of them:
     1. Text goes inside "quotes".
     2. Every line inside a list ends with a comma.
     3. To make a link inside any sentence: [words you see](https://the-link)
     4. To delete anything, delete its whole line.
   ========================================================================== */

const SITE = {

  name:      "Swastik Shrivastava",
  location:  "Bengaluru, IN",
  timezone:  "Asia/Kolkata",

  intro:     "Hello, I'm Swastik. I work in brand and product marketing, and I've spent the last few years on stage as a quizmaster. This is where I keep what I've shipped and what I'm thinking about.",

  photo:     "portrait.jpg",          // put a photo in the repo with this name, or set to ""

  links: [
    { label: "email",    url: "mailto:swastik.shrivastava@gmail.com" },
    { label: "linkedin", url: "https://www.linkedin.com/in/swastik-shrivastava-070538246/" },
    // to add more, copy a line above and change the label and url
  ],

  /* --- SECTIONS ------------------------------------------------------------
     Three kinds you can use. Copy any block to add a new section,
     delete a block to remove one, move a block to reorder the page.

       type: "bullets"  -> a simple list of sentences
       type: "cards"    -> name + one line under it (good for work, projects)
       type: "links"    -> date + title, links out (good for writing, press)
     ----------------------------------------------------------------------- */

  sections: [

    {
      title: "Summary",
      type: "bullets",
      items: [
        "Brand & Product Marketing at [Angel One](https://www.angelone.in), 2025–26",
        "Market research before that, at [Kantar IMRB](https://www.kantar.com) in Mumbai",
        "200+ quizzes hosted across 100+ schools since 2021",
        "Quizmaster for [Zee MindWars](https://www.zeemindwars.com), 2022–24",
        "First place at NSE Financial Quest, national level",
        "B.Tech in Electronics & Communication, UIT-RGPV Bhopal",
        "Currently looking for my next brand or product marketing role",
      ],
    },

    {
      title: "Work",
      type: "cards",
      items: [
        { name: "Campaign name here",  note: "One line on what it was and what it moved. Numbers help.", url: "" },
        { name: "Another campaign",    note: "One line on what it was and what it moved.", url: "" },
        { name: "A third one",         note: "One line on what it was and what it moved.", url: "" },
      ],
    },

    {
      title: "Writing",
      type: "links",
      items: [
        { date: "01.09.26", name: "Post title goes here", url: "" },
        { date: "14.08.26", name: "Another post title",   url: "" },
      ],
    },

  ],

};

/* ===== END OF THE PART YOU EDIT ========================================== */
</script>

<style>
  :root { --bg:#ffffff; --fg:#111827; --muted:#4b5563; --line:#e5e7eb; --chip:#f3f4f6; }
  [data-theme="dark"] { --bg:#000; --fg:#f2f2f2; --muted:#8a8a8a; --line:#232323; --chip:#141414; }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.6; letter-spacing: -0.011em;
    -webkit-font-smoothing: antialiased;
    transition: background 160ms ease, color 160ms ease;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px 96px; }

  a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); transition: border-color 120ms ease; }
  a:hover { border-color: var(--fg); }
  a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 2px; }

  .top { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:28px; }
  .top .name { font-weight:600; border:0; }
  .toggle { background:none; border:0; padding:0; color:var(--muted); font:inherit; font-size:14px; cursor:pointer; }
  .toggle:hover { color: var(--fg); }

  .meta { display:flex; gap:14px; align-items:baseline; color:var(--muted); font-size:13px; padding-bottom:28px; }

  .intro { font-size:19px; line-height:1.55; margin:0 0 32px; max-width:34em; }

  .portrait {
    width:170px; aspect-ratio:361/391; object-fit:cover; border-radius:6px;
    display:block; margin-bottom:44px; background:var(--chip);
  }

  section { margin-bottom: 56px; }
  h2 {
    font-size:13px; font-weight:600; color:var(--muted);
    margin:0 0 20px; padding-bottom:10px; border-bottom:1px solid var(--line);
  }

  ul.bullets { list-style:none; margin:0; padding:0; }
  ul.bullets li { margin-bottom:12px; padding-left:18px; position:relative; }
  ul.bullets li::before {
    content:""; position:absolute; left:0; top:11px;
    width:5px; height:5px; border-radius:50%; background:var(--line);
  }

  .card { padding:14px 0; border-bottom:1px solid var(--line); }
  .card:last-child { border-bottom:0; }
  .card h3 { margin:0; font-size:16px; font-weight:600; }
  .card h3 a { border:0; }
  .card h3 a:hover { border-bottom:1px solid var(--fg); }
  .card p { margin:2px 0 0; color:var(--muted); font-size:14px; }

  .post { display:flex; gap:16px; padding:11px 0; border:0; border-bottom:1px solid var(--line); }
  .post:last-child { border-bottom:0; }
  .post time { color:var(--muted); font-size:14px; flex:none; width:68px; }

  footer {
    display:flex; flex-wrap:wrap; gap:18px; color:var(--muted); font-size:14px;
    padding-top:28px; border-top:1px solid var(--line);
  }
  footer a { border:0; }
  footer a:hover { color: var(--fg); }

  .oops { color:#e06c5a; font-size:14px; line-height:1.7; }

  @media (max-width:520px) {
    .wrap { padding:28px 20px 72px; }
    .intro { font-size:17px; }
    .post { flex-direction:column; gap:2px; }
    .post time { width:auto; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>

<body>
<div class="wrap">
  <div class="top">
    <a class="name" href="/" id="topname"></a>
    <button class="toggle" id="theme" aria-label="Switch theme">◐</button>
  </div>
  <div class="meta"><span id="place"></span><span id="clock"></span></div>
  <div id="page"></div>
</div>

<script>
(function () {
  var esc = function (s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  };

  // turns [words](https://link) into a real link
  var text = function (s) {
    return esc(s).replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, label, href) {
      return '<a href="' + href + '">' + label + '</a>';
    });
  };

  var link = function (name, url) {
    return url ? '<a href="' + esc(url) + '">' + esc(name) + '</a>' : esc(name);
  };

  try {
    document.title = SITE.name;
    document.getElementById("topname").textContent = SITE.name;
    document.getElementById("place").textContent = SITE.location;

    var html = '<p class="intro">' + text(SITE.intro) + "</p>";

    if (SITE.photo) {
      html += '<img class="portrait" src="' + esc(SITE.photo) + '" alt="' +
              esc(SITE.name) + '" onerror="this.remove()">';
    }

    (SITE.sections || []).forEach(function (sec) {
      var body = "";

      if (sec.type === "bullets") {
        body = '<ul class="bullets">' + (sec.items || []).map(function (i) {
          return "<li>" + text(i) + "</li>";
        }).join("") + "</ul>";
      }

      else if (sec.type === "cards") {
        body = (sec.items || []).map(function (i) {
          return '<div class="card"><h3>' + link(i.name, i.url) + "</h3>" +
                 (i.note ? "<p>" + text(i.note) + "</p>" : "") + "</div>";
        }).join("");
      }

      else if (sec.type === "links") {
        body = (sec.items || []).map(function (i) {
          var inner = '<time>' + esc(i.date || "") + "</time><span>" + esc(i.name) + "</span>";
          return i.url
            ? '<a class="post" href="' + esc(i.url) + '">' + inner + "</a>"
            : '<div class="post">' + inner + "</div>";
        }).join("");
      }

      html += "<section><h2>" + esc(sec.title) + "</h2>" + body + "</section>";
    });

    html += "<footer>" + (SITE.links || []).map(function (l) {
      return '<a href="' + esc(l.url) + '">' + esc(l.label) + "</a>";
    }).join("") + "</footer>";

    document.getElementById("page").innerHTML = html;

    // clock
    var clock = document.getElementById("clock");
    var tick = function () {
      clock.textContent = new Date().toLocaleTimeString("en-IN", {
        hour: "2-digit", minute: "2-digit", timeZone: SITE.timezone
      });
    };
    tick(); setInterval(tick, 30000);

  } catch (err) {
    document.getElementById("page").innerHTML =
      '<p class="oops">Something in the SITE block is broken, so the page stopped loading. ' +
      "It's almost always a missing comma at the end of a line, or a quote mark that got deleted. " +
      "Undo your last edit and it'll come back.<br><br>Technical detail: " + esc(err.message) + "</p>";
  }

  var root = document.documentElement;
  document.getElementById("theme").addEventListener("click", function () {
    root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
})();
</script>
</body>
</html>
